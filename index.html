<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>训练日历 · Fitness Calendar</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root {
  --bg: #0A0E1A;
  --card: rgba(255, 255, 255, 0.05);
  --card-strong: rgba(255, 255, 255, 0.08);
  --primary: #00D4FF;
  --primary-dim: rgba(0, 212, 255, 0.18);
  --training: #FF6B35;
  --training-dim: rgba(255, 107, 53, 0.25);
  --cardio: #4ADE80;
  --cardio-dim: rgba(74, 222, 128, 0.18);
  --body: #FBBF24;
  --body-dim: rgba(251, 191, 36, 0.18);
  --time: #C084FC;
  --time-dim: rgba(192, 132, 252, 0.18);
  --text: #E8ECF1;
  --text-dim: #8B95A7;
  --text-faint: #5C6678;
  --border: rgba(255, 255, 255, 0.08);
  --danger: rgba(255, 107, 53, 0.2);
  --muscle-base: #60A5FA;
  --muscle-active: #FF6B35;
  --muscle-stroke: rgba(255, 255, 255, 0.18);
  --muscle-silhouette: rgba(255, 255, 255, 0.04);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  background-image:
    radial-gradient(circle at 15% 0%, rgba(0, 212, 255, 0.08), transparent 50%),
    radial-gradient(circle at 85% 100%, rgba(255, 107, 53, 0.05), transparent 50%);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  max-width: 1400px;
  margin: 0 auto;
  padding: 16px;
  gap: 16px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 24px;
  background: var(--card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 16px;
  flex-wrap: wrap;
  gap: 12px;
}

.logo { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.logo-icon { font-size: 22px; }

.header-tools {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.month-nav { display: flex; align-items: center; gap: 8px; }
.month-nav button {
  background: var(--card-strong);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-family: inherit;
  font-weight: 500;
  transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
}
.month-nav button:hover {
  background: var(--primary-dim);
  border-color: var(--primary);
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0, 212, 255, 0.25);
}
.month-nav button:active { transform: translateY(0); }
.month-nav button.icon-btn { padding: 8px 14px; font-size: 18px; line-height: 1; }
.month-nav button.primary-btn {
  background: var(--primary);
  color: var(--bg);
  border-color: var(--primary);
  font-weight: 600;
}
.month-nav button.primary-btn:hover {
  background: var(--primary);
  filter: brightness(1.1);
}
#month-label {
  font-size: 17px;
  font-weight: 600;
  min-width: 130px;
  text-align: center;
  letter-spacing: 0.5px;
}

main {
  display: grid;
  grid-template-columns: 240px 1fr 380px;
  gap: 16px;
  flex: 1;
  min-height: 0;
}

/* Muscle model panel */
.muscle-panel {
  background: var(--card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
}

.muscle-panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: var(--text-dim);
  font-weight: 500;
}

.muscle-panel-date { color: var(--text); }

.view-toggle {
  display: flex;
  background: var(--card-strong);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 2px;
  gap: 2px;
}
.view-toggle button {
  background: transparent;
  border: none;
  color: var(--text-dim);
  padding: 4px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 11px;
  font-family: inherit;
  font-weight: 500;
  transition: all 200ms;
}
.view-toggle button.active {
  background: var(--primary-dim);
  color: var(--primary);
}

.muscle-svg-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
  padding: 4px 0;
}

.muscle-view {
  width: 100%;
  max-height: 100%;
  height: auto;
  display: block;
}
.muscle-view.back { display: none; }
.muscle-view.back.is-active { display: block; }
.muscle-view.front.is-active { display: block; }

.muscle-view .body {
  fill: var(--muscle-silhouette);
  stroke: none;
}

.muscle-region {
  fill: var(--muscle-base);
  stroke: var(--muscle-stroke);
  stroke-width: 0.8;
  stroke-linejoin: round;
  transition: fill 280ms cubic-bezier(0.4, 0, 0.2, 1);
}
.muscle-region.active { fill: var(--muscle-active); }

/* 动作肌肉标注列表 (SVG 下方) */
.muscle-exercises {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 240px;
  overflow-y: auto;
  padding: 2px 0;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.muscle-exercises::-webkit-scrollbar { width: 4px; }
.muscle-exercises::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.muscle-ex-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  cursor: pointer;
  transition: opacity 180ms, border-color 180ms, background 180ms;
}
.muscle-ex-item:hover { border-color: var(--primary); }
.muscle-ex-item.selected {
  border-color: var(--muscle-active);
  background: rgba(255, 107, 53, 0.10);
}
.muscle-ex-item.dimmed { opacity: 0.4; }
.muscle-ex-item.dimmed:hover { opacity: 0.7; }
.muscle-ex-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 5px;
}
.muscle-ex-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.muscle-ex-tag {
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--muscle-base);
  color: rgba(10, 14, 26, 0.85);
  font-weight: 500;
}
.muscle-ex-tag.unmapped {
  background: var(--card-strong);
  color: var(--text-dim);
}
.muscle-ex-empty {
  text-align: center;
  color: var(--text-dim);
  font-size: 12px;
  padding: 20px 8px;
}

@media (prefers-reduced-motion: reduce) {
  .muscle-region { transition: none; }
}

@media (max-width: 1024px) {
  main { grid-template-columns: 1fr 380px; }
  .muscle-panel { display: none; }
}

.calendar-container {
  background: var(--card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.weekday-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.weekday-row div {
  text-align: center;
  font-size: 12px;
  color: var(--text-dim);
  padding: 6px 0;
  font-weight: 500;
  letter-spacing: 1px;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  flex: 1;
  position: relative;
}

.day-cell {
  aspect-ratio: 1 / 1.05;
  min-height: 88px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  background: var(--card);
  border: 1px solid transparent;
  position: relative;
  transition: border-color 150ms ease, background 150ms ease, transform 200ms cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
  user-select: none;
  padding: 6px 4px 4px;
}

/* 训练过的日期默认是 copy 光标，提示可拖拽 */
.day-cell.has-training { cursor: copy; }

/* 框选进行时所有日期变为 crosshair */
body.box-dragging .calendar-grid,
body.box-dragging .day-cell { cursor: crosshair !important; }

.day-cell:hover {
  border-color: rgba(255, 255, 255, 0.15);
  transform: translateY(-2px);
  z-index: 1;
}

.day-cell.other-month { opacity: 0.32; }
.day-cell.other-month:hover { opacity: 0.55; }

.day-cell.today {
  border-color: var(--primary);
  box-shadow: 0 0 0 1px var(--primary), 0 0 24px var(--primary-dim);
}
.day-cell.today .day-num { color: var(--primary); font-weight: 700; }

.day-cell.selected {
  border-color: var(--primary);
  background: var(--primary-dim) !important;
}

/* 框选中的源单元：青色 */
.day-cell.box-selected {
  border-color: var(--primary);
  background: rgba(0, 212, 255, 0.18) !important;
  box-shadow: 0 0 0 1px var(--primary), 0 0 16px rgba(0, 212, 255, 0.3);
  transform: none;
  z-index: 2;
}

/* 落点单元：橙色，优先级高于 box-selected */
.day-cell.drop-target {
  border-color: var(--training);
  background: rgba(255, 107, 53, 0.22) !important;
  box-shadow: 0 0 0 2px var(--training), 0 0 20px rgba(255, 107, 53, 0.4);
  transform: none;
  z-index: 3;
}

.day-num {
  font-size: 14px;
  line-height: 1;
  font-weight: 600;
  z-index: 2;
  margin-bottom: 4px;
}

.day-lines {
  flex: 1;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 2px;
  justify-content: flex-start;
  align-items: stretch;
  min-height: 0;
}

.day-line {
  font-size: 10px;
  line-height: 1.25;
  width: 100%;
  padding: 1px 5px;
  border-radius: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: center;
  font-weight: 500;
  letter-spacing: -0.2px;
}
.day-line.weight { color: var(--training); background: rgba(255, 107, 53, 0.10); }
.day-line.distance { color: var(--cardio); background: rgba(74, 222, 128, 0.10); }
.day-line.reps { color: var(--body); background: rgba(251, 191, 36, 0.10); }
.day-line.time { color: var(--time); background: rgba(192, 132, 252, 0.10); }

.day-more {
  font-size: 9px;
  color: var(--text-faint);
  font-weight: 600;
  text-align: center;
  margin-top: 1px;
}

/* 框选矩形 */
.box-rect {
  position: fixed;
  display: none;
  border: 1.5px dashed var(--primary);
  background: rgba(0, 212, 255, 0.06);
  border-radius: 6px;
  pointer-events: none;
  z-index: 60;
  box-shadow: 0 0 0 1px rgba(0, 212, 255, 0.25), inset 0 0 0 1px rgba(0, 212, 255, 0.08);
}
.box-rect.show { display: block; }

.calendar-menu {
  display: flex;
  gap: 8px;
  padding-top: 4px;
  flex-wrap: wrap;
}
.calendar-menu button {
  flex: 1;
  min-width: 90px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 8px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
}
.calendar-menu button:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: var(--primary-dim);
}

.calendar-hint {
  font-size: 11px;
  color: var(--text-faint);
  text-align: center;
  padding: 2px 4px 0;
  line-height: 1.5;
}
.calendar-hint .hint-icon { margin-right: 4px; }
.calendar-hint strong { color: var(--text-dim); font-weight: 600; }

/* Drawer */
.drawer {
  background: var(--card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.drawer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.drawer-header h2 {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.3px;
}
.drawer-close {
  background: transparent;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 24px;
  line-height: 1;
  padding: 4px 10px;
  border-radius: 8px;
  transition: all 200ms;
  font-family: inherit;
}
.drawer-close:hover {
  background: var(--card-strong);
  color: var(--text);
}

.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 24px;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.drawer-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--text-dim);
  gap: 12px;
  padding: 32px 16px;
}
.drawer-empty .icon { font-size: 44px; opacity: 0.7; }
.drawer-empty .hint { font-size: 12px; opacity: 0.7; }

.exercises-list { display: flex; flex-direction: column; gap: 14px; }

.exercise-block {
  background: var(--card-strong);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  transition: all 200ms;
}

.exercise-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  gap: 8px;
}
.exercise-name { font-weight: 600; font-size: 15px; flex: 1; }
.exercise-tag {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--card);
  color: var(--text-dim);
  border: 1px solid var(--border);
  font-weight: 500;
}
.exercise-tag.weight { color: var(--training); border-color: rgba(255, 107, 53, 0.3); }
.exercise-tag.distance { color: var(--cardio); border-color: rgba(74, 222, 128, 0.3); }
.exercise-tag.reps { color: var(--body); border-color: rgba(251, 191, 36, 0.3); }
.exercise-tag.time { color: var(--time); border-color: rgba(192, 132, 252, 0.3); }

.exercise-delete {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  cursor: pointer;
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 6px;
  transition: all 200ms;
  font-family: inherit;
}
.exercise-delete:hover {
  border-color: var(--training);
  color: var(--training);
  background: var(--danger);
}

.sets-table { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }

.set-row {
  display: grid;
  gap: 6px;
  align-items: center;
}
.set-row.unit-weight { grid-template-columns: 22px 1fr 1fr 28px; }
.set-row.unit-time { grid-template-columns: 22px 1fr 1fr 28px; }
.set-row.unit-distance,
.set-row.unit-reps { grid-template-columns: 22px 1fr 28px; }

.set-row .set-num {
  text-align: center;
  color: var(--text-dim);
  font-size: 12px;
  font-weight: 600;
}

.input-cell {
  position: relative;
  display: flex;
  align-items: center;
}
.input-cell input {
  width: 100%;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 26px 8px 10px;
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  transition: all 200ms;
  -moz-appearance: textfield;
}
.input-cell input::-webkit-outer-spin-button,
.input-cell input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
.input-cell input:focus {
  outline: none;
  border-color: var(--primary);
  background: rgba(0, 0, 0, 0.5);
}
.input-cell .unit {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 10px;
  color: var(--text-dim);
  pointer-events: none;
  font-weight: 500;
}

.set-delete {
  background: transparent;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  padding: 4px;
  border-radius: 4px;
  transition: all 200ms;
  font-family: inherit;
}
.set-delete:hover {
  color: var(--training);
  background: var(--danger);
}

.add-set-btn {
  background: transparent;
  border: 1px dashed var(--border);
  color: var(--text-dim);
  padding: 9px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  width: 100%;
  transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
}
.add-set-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: var(--primary-dim);
  transform: translateY(-1px);
}

.drawer-footer {
  padding: 16px 24px 20px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.exercise-selector {
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 11px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
  width: 100%;
  cursor: pointer;
  transition: all 200ms;
  appearance: none;
  -webkit-appearance: none;
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath fill='%238B95A7' d='M6 8L2 4h8z'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 12px center;
  background-size: 12px;
  padding-right: 32px;
}
.exercise-selector:focus { outline: none; border-color: var(--primary); }
.exercise-selector option { background: var(--bg); color: var(--text); }

.clear-day-btn {
  background: transparent;
  border: 1px solid rgba(255, 107, 53, 0.3);
  color: var(--training);
  padding: 8px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  transition: all 200ms;
}
.clear-day-btn:hover { background: var(--danger); border-color: var(--training); }

footer {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.stat {
  background: var(--card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  text-align: center;
  transition: all 200ms;
}
.stat:hover {
  border-color: var(--primary-dim);
  transform: translateY(-2px);
}
.stat-label {
  display: block;
  color: var(--text-dim);
  font-size: 11px;
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}
.stat-value {
  display: block;
  font-size: 22px;
  font-weight: 600;
  color: var(--primary);
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
  min-height: 27px;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 110px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(10, 14, 26, 0.95);
  border: 1px solid var(--primary);
  color: var(--text);
  padding: 10px 18px;
  border-radius: 24px;
  font-size: 13px;
  z-index: 300;
  opacity: 0;
  pointer-events: none;
  transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  max-width: 90vw;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.toast-icon {
  color: var(--primary);
  font-weight: bold;
  font-size: 14px;
}

/* Day tooltip */
.day-tooltip {
  position: fixed;
  background: rgba(10, 14, 26, 0.96);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 12px;
  z-index: 150;
  pointer-events: none;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 160ms ease-out, transform 160ms ease-out;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  min-width: 220px;
  max-width: 320px;
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.04);
  visibility: hidden;
}
.day-tooltip.show {
  opacity: 1;
  transform: translateY(0);
  visibility: visible;
}

.day-tooltip-header {
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.day-tooltip-header .badge {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 4px;
  background: rgba(255, 107, 53, 0.18);
  color: var(--training);
  font-weight: 600;
}

.day-tooltip-body {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.day-tooltip-exercise {
  border-left: 2px solid var(--border);
  padding-left: 10px;
}
.day-tooltip-exercise.weight { border-left-color: var(--training); }
.day-tooltip-exercise.distance { border-left-color: var(--cardio); }
.day-tooltip-exercise.reps { border-left-color: var(--body); }
.day-tooltip-exercise.time { border-left-color: var(--time); }

.day-tooltip-exercise-name {
  font-weight: 600;
  font-size: 12px;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text);
}

.day-tooltip-exercise-name .unit-tag {
  font-size: 9px;
  padding: 1px 6px;
  border-radius: 3px;
  font-weight: 500;
  letter-spacing: 0.3px;
}
.day-tooltip-exercise-name .unit-tag.weight { color: var(--training); background: rgba(255, 107, 53, 0.15); }
.day-tooltip-exercise-name .unit-tag.distance { color: var(--cardio); background: rgba(74, 222, 128, 0.15); }
.day-tooltip-exercise-name .unit-tag.reps { color: var(--body); background: rgba(251, 191, 36, 0.15); }
.day-tooltip-exercise-name .unit-tag.time { color: var(--time); background: rgba(192, 132, 252, 0.15); }

.day-tooltip-set {
  font-size: 11px;
  color: var(--text-dim);
  padding: 1px 0;
  display: flex;
  align-items: center;
  gap: 6px;
}
.day-tooltip-set .set-idx {
  display: inline-block;
  min-width: 18px;
  text-align: center;
  font-weight: 600;
  color: var(--text-faint);
  font-size: 10px;
}
.day-tooltip-set .set-val { color: var(--text); font-weight: 500; }

.day-tooltip-footer {
  font-size: 10px;
  color: var(--text-faint);
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
  text-align: center;
}

/* Modal */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms;
}
.modal-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}

.modal {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  width: 92%;
  max-width: 520px;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background-image:
    radial-gradient(circle at 15% 0%, rgba(0, 212, 255, 0.1), transparent 50%),
    radial-gradient(circle at 85% 100%, rgba(255, 107, 53, 0.06), transparent 50%);
  transform: scale(0.96);
  transition: transform 200ms cubic-bezier(0.4, 0, 0.2, 1);
}
.modal-backdrop.open .modal { transform: scale(1); }

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
  flex-shrink: 0;
}
.modal-title { font-size: 16px; font-weight: 600; }
.modal-close {
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-size: 24px;
  cursor: pointer;
  padding: 4px 10px;
  border-radius: 8px;
  font-family: inherit;
  line-height: 1;
}
.modal-close:hover { background: var(--card-strong); color: var(--text); }

.modal-body {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
  margin: 0 -8px;
  padding: 0 8px;
}

.modal-tip {
  font-size: 11px;
  color: var(--text-dim);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 16px;
  line-height: 1.5;
}

.exercise-group { margin-bottom: 16px; }
.exercise-group h3 {
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1.2px;
  margin-bottom: 8px;
  font-weight: 600;
}

.exercise-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 6px;
  transition: all 200ms;
  gap: 8px;
}
.exercise-row:hover { border-color: rgba(255, 255, 255, 0.15); }
.exercise-row-info { flex: 1; min-width: 0; }
.exercise-row-name { font-weight: 500; font-size: 14px; }
.exercise-row-meta {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 2px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}
.exercise-row-meta .meta-unit { font-weight: 500; }
.exercise-row-meta .meta-unit.weight { color: var(--training); }
.exercise-row-meta .meta-unit.distance { color: var(--cardio); }
.exercise-row-meta .meta-unit.reps { color: var(--body); }
.exercise-row-meta .meta-unit.time { color: var(--time); }

.exercise-row-delete {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 5px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 11px;
  font-family: inherit;
  transition: all 200ms;
  flex-shrink: 0;
}
.exercise-row-delete:hover {
  border-color: var(--training);
  color: var(--training);
  background: var(--danger);
}

.add-exercise-toggle {
  width: 100%;
  background: transparent;
  border: 1px dashed var(--border);
  color: var(--text-dim);
  padding: 11px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  transition: all 200ms;
  margin-top: 4px;
}
.add-exercise-toggle:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: var(--primary-dim);
}

.add-exercise-form {
  background: var(--card-strong);
  border: 1px solid var(--primary-dim);
  border-radius: 12px;
  padding: 16px;
  margin-top: 10px;
}
.add-exercise-form h4 {
  font-size: 13px;
  margin-bottom: 12px;
  font-weight: 600;
}

.form-field { margin-bottom: 12px; }
.form-field label {
  display: block;
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 4px;
  letter-spacing: 0.3px;
}
.form-field input,
.form-field select {
  width: 100%;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  transition: all 200ms;
}
.form-field input:focus,
.form-field select:focus {
  outline: none;
  border-color: var(--primary);
}
.form-field select { cursor: pointer; }
.form-field select option { background: var(--bg); color: var(--text); }

.form-actions { display: flex; gap: 8px; margin-top: 12px; }
.form-actions button {
  flex: 1;
  padding: 9px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  font-weight: 500;
  transition: all 200ms;
}
.btn-primary {
  background: var(--primary);
  color: var(--bg);
  border: 1px solid var(--primary);
}
.btn-primary:hover { filter: brightness(1.1); }
.btn-ghost {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
}
.btn-ghost:hover {
  border-color: var(--text);
  color: var(--text);
}

/* Scrollbar */
.drawer-body::-webkit-scrollbar,
.modal-body::-webkit-scrollbar { width: 4px; }
.drawer-body::-webkit-scrollbar-track,
.modal-body::-webkit-scrollbar-track { background: transparent; }
.drawer-body::-webkit-scrollbar-thumb,
.modal-body::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.1);
  border-radius: 2px;
}
.drawer-body::-webkit-scrollbar-thumb:hover,
.modal-body::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.2);
}

/* Mobile */
@media (max-width: 768px) {
  .app { padding: 8px; gap: 8px; }
  header { padding: 12px 16px; flex-direction: column; gap: 8px; }
  #month-label { font-size: 16px; min-width: auto; }
  main { grid-template-columns: 1fr; }
  .drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 100%;
    max-width: 100%;
    border-radius: 0;
    z-index: 100;
    transform: translateX(100%);
    transition: transform 280ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .drawer.open { transform: translateX(0); }
  .calendar-container { padding: 12px; }
  footer { grid-template-columns: repeat(2, 1fr); }

  .day-cell {
    aspect-ratio: 1;
    min-height: 0;
    padding: 3px 2px;
  }
  .day-num { font-size: 12px; margin-bottom: 2px; }
  .day-line { font-size: 8px; padding: 0 2px; }
  .day-more { font-size: 7px; }
  .stat-value { font-size: 18px; min-height: 22px; }
  .calendar-hint { font-size: 10px; }
  .toast { bottom: 90px; font-size: 12px; padding: 8px 14px; }
}

@media (max-width: 380px) {
  .month-nav button { padding: 6px 12px; font-size: 13px; }
  .month-nav button.icon-btn { padding: 6px 10px; }
  #month-label { font-size: 14px; }
}

/* Settings button + sync indicator */
.settings-btn {
  background: var(--card-strong);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
  line-height: 1;
  font-family: inherit;
  transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
}
.settings-btn:hover {
  border-color: var(--primary);
  background: var(--primary-dim);
}

.sync-indicator {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-dim);
  padding: 6px 11px;
  border-radius: 8px;
  background: var(--card-strong);
  border: 1px solid var(--border);
  cursor: default;
  transition: all 200ms;
  font-weight: 500;
  letter-spacing: 0.3px;
  white-space: nowrap;
}
.sync-indicator .sync-icon {
  font-size: 13px;
  line-height: 1;
  display: inline-block;
}
.sync-indicator.sync-idle .sync-icon { color: var(--cardio); }
.sync-indicator.sync-pending .sync-icon { color: var(--body); }
.sync-indicator.sync-syncing .sync-icon {
  color: var(--primary);
  animation: sync-spin 1.1s linear infinite;
}
.sync-indicator.sync-error { border-color: rgba(255, 107, 53, 0.35); }
.sync-indicator.sync-error .sync-icon { color: var(--training); }
.sync-indicator.sync-no-token { opacity: 0.55; }

@keyframes sync-spin {
  to { transform: rotate(360deg); }
}

/* Token setup modal */
.token-display {
  background: rgba(0, 0, 0, 0.4);
  padding: 10px 12px;
  border-radius: 8px;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 12px;
  word-break: break-all;
  border: 1px solid var(--border);
  margin-bottom: 12px;
  color: var(--text);
}
.token-display.empty {
  color: var(--text-faint);
  font-style: italic;
  font-family: inherit;
}

.pat-input {
  width: 100%;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 12px;
  border-radius: 6px;
  font-size: 13px;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  margin-bottom: 12px;
  letter-spacing: 0.5px;
  transition: all 200ms;
}
.pat-input:focus {
  outline: none;
  border-color: var(--primary);
  background: rgba(0, 0, 0, 0.5);
}

.repo-info {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 14px;
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.6;
}
.repo-info code {
  color: var(--primary);
  background: rgba(0, 212, 255, 0.08);
  padding: 1px 6px;
  border-radius: 4px;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 11px;
}

.pat-link {
  display: inline-block;
  background: var(--primary-dim);
  border: 1px solid var(--primary);
  color: var(--primary);
  padding: 7px 14px;
  border-radius: 6px;
  text-decoration: none;
  font-size: 12px;
  font-weight: 500;
  margin-bottom: 14px;
  transition: all 200ms;
}
.pat-link:hover {
  filter: brightness(1.15);
  transform: translateY(-1px);
}

@media (max-width: 768px) {
  .settings-btn { padding: 6px 10px; font-size: 13px; }
  .sync-indicator { font-size: 10px; padding: 5px 8px; gap: 4px; }
  .sync-indicator .sync-text { display: none; }
  .sync-indicator .sync-icon { font-size: 14px; }
}

/* Bootstrap loading overlay (shown during initial GitHub fetch) */
.bootstrap-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 14, 26, 0.78);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 400;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  color: var(--text);
  font-size: 14px;
}
.bootstrap-overlay.hidden { display: none; }
.bootstrap-spinner {
  width: 38px;
  height: 38px;
  border: 3px solid rgba(0, 212, 255, 0.15);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: bootstrap-spin 0.9s linear infinite;
}
@keyframes bootstrap-spin { to { transform: rotate(360deg); } }
.bootstrap-overlay .bootstrap-tip {
  color: var(--text-dim);
  font-size: 12px;
  margin-top: 4px;
}

  const REGION_LABELS = {

  // ---------- sync (GitHub-backed cross-device sync) ----------
  const TOKEN_KEY = 'fitness-calendar-token';
  const DATA_FILE = 'data.json';
  const SYNC_DEBOUNCE_MS = 1500;
  const SYNC_RETRY_MAX_MS = 60000;

  const REPO = (function() {
    const host = window.location.hostname;
    const parts = window.location.pathname.split('/').filter(Boolean);
    if (host.endsWith('.github.io')) {
      const owner = host.replace(/\.github\.io$/, '');
      const repo = parts[0] || `${owner}.github.io`;
      return { owner, repo, branch: 'main' };
    }
    return { owner: parts[0] || '', repo: parts[1] || '', branch: 'main' };
  })();

  let authToken = null;
  let syncState = 'no-token';
  let syncTimer = null;
  let retryTimer = null;
  let retryAttempt = 0;
  let bootstrapping = false;

  function loadToken() { return localStorage.getItem(TOKEN_KEY); }
  function saveToken(t) { localStorage.setItem(TOKEN_KEY, t); }
  function clearToken() {
    localStorage.removeItem(TOKEN_KEY);
    authToken = null;
    setSyncState('no-token');
  }
  function initToken() {
    authToken = loadToken();
    if (authToken) syncState = 'idle';
    updateSyncIndicator();
  }

  function b64encode(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }
  function b64decode(str) {
    return decodeURIComponent(escape(atob(str.replace(/\s/g, ''))));
  }

  let lastSyncError = null;

  async function gh(path, opts = {}) {
    const headers = {
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(opts.headers || {})
    };
    if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
    let res;
    try {
      res = await fetch(`https://api.github.com${path}`, { ...opts, headers });
    } catch (e) {
      const err = new Error('网络错误：' + e.message);
      err.status = 0;
      throw err;
    }
    if (!res.ok) {
      let body = null;
      try { body = await res.json(); } catch (_) {}
      const apiMsg = (body && body.message) ? body.message : res.statusText || '未知错误';
      const err = new Error(`HTTP ${res.status}：${apiMsg}`);
      err.status = res.status;
      err.body = body;
      throw err;
    }
    return res;
  }

  async function validateToken() {
    const res = await gh('/user');
    return await res.json();
  }

  async function fetchRemoteMeta() {
    const { owner, repo, branch } = REPO;
    try {
      const res = await gh(`/repos/${owner}/${repo}/contents/${DATA_FILE}?ref=${branch}`);
      return await res.json();
    } catch (err) {
      if (err.status === 404) return null;
      throw err;
    }
  }

  async function pushRemote(content, sha) {
    const { owner, repo, branch } = REPO;
    const body = {
      message: 'chore: update fitness calendar data',
      content: b64encode(JSON.stringify(content, null, 2)),
      branch,
    };
    if (sha) body.sha = sha;
    const res = await gh(`/repos/${owner}/${repo}/contents/${DATA_FILE}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    return await res.json();
  }

  function setSyncState(s) {
    syncState = s;
    updateSyncIndicator();
  }

  function updateSyncIndicator() {
    const el = document.getElementById('sync-indicator');
    if (!el) return;
    const labels = {
      'no-token': { icon: '⚙', text: '未配置同步', cls: 'sync-no-token' },
      'idle':     { icon: '↑', text: '已同步',     cls: 'sync-idle' },
      'pending':  { icon: '↻', text: '待同步',     cls: 'sync-pending' },
      'syncing':  { icon: '↻', text: '同步中',     cls: 'sync-syncing' },
      'error':    { icon: '⚠', text: '同步失败',   cls: 'sync-error' },
    };
    const l = labels[syncState] || labels['no-token'];
    el.className = 'sync-indicator ' + l.cls;
    el.innerHTML = `<span class="sync-icon">${l.icon}</span><span class="sync-text">${l.text}</span>`;
    el.title = syncState === 'error'
      ? '同步失败，点击查看'
      : `${l.text} · ${REPO.owner}/${REPO.repo}`;
    el.style.cursor = syncState === 'error' ? 'pointer' : 'default';
  }

  function scheduleSync() {
    if (!authToken) return;
    setSyncState('pending');
    clearTimeout(syncTimer);
    syncTimer = setTimeout(syncNow, SYNC_DEBOUNCE_MS);
  }

  async function syncNow() {
    if (!authToken) return;
    setSyncState('syncing');
    let lastErr = null;
    // 409 通常是两台设备几乎同时推送导致的竞态，先快速连试 8 次，每次间隔 200ms
    // 让对方设备的请求有机会落地。非 409 错误直接跳出。
    for (let attempt = 0; attempt < 8; attempt++) {
      try {
        const meta = await fetchRemoteMeta();
        const sha = meta ? meta.sha : null;
        // 本地与远端完全一致（典型场景：add 后立刻 delete 把改动抵消了），
        // GitHub Contents API 对"内容相同"的 PUT 会返回 422，没必要再推一次。
        if (meta && meta.content) {
          try {
            const remoteJson = JSON.parse(b64decode(meta.content));
            if (JSON.stringify(remoteJson, null, 2) === JSON.stringify(data, null, 2)) {
              retryAttempt = 0;
              lastSyncError = null;
              setSyncState('idle');
              return;
            }
          } catch (_) {
            // 远端内容解析失败，按"内容不同"处理，继续尝试 push
          }
        }
        await pushRemote(data, sha);
        retryAttempt = 0;
        lastSyncError = null;
        setSyncState('idle');
        return;
      } catch (err) {
        lastErr = err;
        if (err.status !== 409) break;
        if (attempt < 7) await new Promise(r => setTimeout(r, 200));
      }
    }
    lastSyncError = lastErr;
    setSyncState('error');
    scheduleRetry();
  }

  function scheduleRetry() {
    clearTimeout(retryTimer);
    const delay = Math.min(SYNC_RETRY_MAX_MS, 2000 * Math.pow(2, retryAttempt));
    retryAttempt++;
    retryTimer = setTimeout(() => {
      syncNow().catch(() => {});
    }, delay);
  }

  function hasLocalTrainingData() {
    return data && data.days && Object.keys(data.days).length > 0;
  }

  function showBootstrap(msg) {
    const ov = document.getElementById('bootstrap-overlay');
    if (ov) {
      ov.classList.remove('hidden');
      if (msg) document.getElementById('bootstrap-msg').textContent = msg;
    }
  }
  function hideBootstrap() {
    const ov = document.getElementById('bootstrap-overlay');
    if (ov) ov.classList.add('hidden');
  }

  async function bootstrapRemote() {
    if (!authToken) return;
    bootstrapping = true;
    showBootstrap('正在加载云端数据...');
    setSyncState('syncing');
    try {
      const meta = await fetchRemoteMeta();
      if (meta) {
        const remote = b64decode(meta.content);
        const parsed = JSON.parse(remote);
        if (parsed.exercises && parsed.days && parsed.meta) {
          data = parsed;
          saveData();
          renderAll();
        }
        retryAttempt = 0;
        setSyncState('idle');
      } else if (hasLocalTrainingData()) {
        await pushRemote(data, null);
        retryAttempt = 0;
        setSyncState('idle');
      } else {
        data = freshData();
        saveData();
        renderAll();
        await pushRemote(data, null);
        retryAttempt = 0;
        setSyncState('idle');
      }
    } catch (err) {
      console.error('云端同步失败：', err);
      lastSyncError = err;
      setSyncState('error');
    } finally {
      bootstrapping = false;
      hideBootstrap();
      if (syncState === 'idle') updateSyncIndicator();
    }
  }

  initToken();

  // ---------- state ----------
  let data = loadData();
  let viewYear, viewMonth;
  let selectedDate = null;
  let maxIntensity = 0;
  let hoverTimeout = null;

  // box selection state
  let boxStart = null;
  let boxStartKey = null;
  let isBoxSelecting = false;
  let boxSelectedKeys = new Set();
  let currentDropKey = null;

  // ---------- helpers ----------
  function dateKey(y, m, d) {
    return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }
  function todayKey() {
    const t = new Date();
    return dateKey(t.getFullYear(), t.getMonth(), t.getDate());
  }
  function parseKey(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return freshData();
      const parsed = JSON.parse(raw);
      if (!parsed.exercises || !parsed.days || !parsed.meta) return freshData();
      if (!Array.isArray(parsed.exercises)) return freshData();
      if (typeof parsed.days !== 'object') return freshData();
      return parsed;
    } catch (e) {
      return freshData();
    }
  }
  function freshData() {
    return {
      exercises: DEFAULT_EXERCISES.slice(),
      days: {},
      meta: { startDate: todayKey() }
    };
  }
  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      if (!bootstrapping) scheduleSync();
    } catch (e) {
      console.error('保存失败', e);
      alert('保存失败：' + e.message);
    }
  }

  function migrateData() {
    let changed = false;
    // 瑜伽动作统一改成 time 单位（之前默认是 reps，语义更贴切）
    const YOGA_NAMES = ['下犬式', '弓步拉伸髂腰肌'];
    for (const k in data.days) {
      const arr = data.days[k];
      if (!Array.isArray(arr)) continue;
      for (const ex of arr) {
        if (!ex.unit) {
          const lib = data.exercises.find(e => e.name === ex.name);
          ex.unit = (lib && lib.unit) || 'weight';
          changed = true;
        }
        if (YOGA_NAMES.includes(ex.name) && ex.unit === 'reps') {
          ex.unit = 'time';
          changed = true;
        }
        if (!Array.isArray(ex.sets)) ex.sets = [];
      }
    }
    for (const ex of data.exercises) {
      if (!ex.unit) {
        ex.unit = 'weight';
        changed = true;
      }
      if (YOGA_NAMES.includes(ex.name) && ex.unit === 'reps') {
        ex.unit = 'time';
        changed = true;
      }
    }
    // 已存在的动作把 category/unit 校准到 DEFAULT_EXERCISES 的最新定义；
    // 故意不追加缺失的默认动作——用户在动作库中删除的动作必须保持删除。
    for (const def of DEFAULT_EXERCISES) {
      const existing = data.exercises.find(e => e.name === def.name);
      if (existing && (existing.category !== def.category || existing.unit !== def.unit)) {
        existing.category = def.category;
        existing.unit = def.unit;
        changed = true;
      }
    }
    if (changed) saveData();
  }

  function hasTraining(key) {
    return data.days[key] && data.days[key].length > 0;
  }

  function getExerciseUnit(name, dayData) {
    if (dayData) {
      const ex = dayData.find(e => e.name === name);
      if (ex && ex.unit) return ex.unit;
    }
    const lib = data.exercises.find(e => e.name === name);
    return (lib && lib.unit) || 'weight';
  }

  function dayBreakdown(dayData) {
    const result = { weight: 0, distance: 0, reps: 0, time: 0 };
    if (!dayData) return result;
    for (const ex of dayData) {
      const unit = ex.unit || getExerciseUnit(ex.name);
      for (const set of ex.sets) {
        if (unit === 'distance') result.distance += Number(set.distance) || 0;
        else if (unit === 'reps') result.reps += Number(set.reps) || 0;
        else if (unit === 'time') result.time += (Number(set.reps) || 0) * (Number(set.duration) || 0);
        else result.weight += (Number(set.reps) || 0) * (Number(set.weight) || 0);
      }
    }
    return result;
  }

  function dayIntensity(dayData) {
    if (!dayData || dayData.length === 0) return 0;
    const b = dayBreakdown(dayData);
    return Math.max(b.weight, b.distance * 1000, b.reps * 100, b.time);
  }

  function computeMaxIntensity() {
    let max = 0;
    for (const k in data.days) {
      const v = dayIntensity(data.days[k]);
      if (v > max) max = v;
    }
    maxIntensity = max;
  }

  function formatExerciseSummary(ex, unit) {
    const name = ex.name;
    if (unit === 'distance') {
      const total = ex.sets.reduce((s, x) => s + (Number(x.distance) || 0), 0);
      if (total === 0) return name;
      return `${name} ${formatNum(total)}km`;
    }
    if (unit === 'reps') {
      const total = ex.sets.reduce((s, x) => s + (Number(x.reps) || 0), 0);
      if (total === 0) return name;
      return `${name} ${total}个`;
    }
    if (unit === 'time') {
      const totalSets = ex.sets.reduce((s, x) => s + (Number(x.reps) || 0), 0);
      const totalSeconds = ex.sets.reduce((s, x) => s + (Number(x.reps) || 0) * (Number(x.duration) || 0), 0);
      if (totalSeconds === 0 && totalSets === 0) return name;
      const maxDur = Math.max(0, ...ex.sets.map(s => Number(s.duration) || 0));
      if (totalSets === 0) return `${name} ${formatDuration(totalSeconds)}`;
      return `${name} ${totalSets}×${formatDuration(maxDur)}`;
    }
    const setCount = ex.sets.length;
    const maxWeight = Math.max(0, ...ex.sets.map(s => Number(s.weight) || 0));
    const totalReps = ex.sets.reduce((s, x) => s + (Number(x.reps) || 0), 0);
    if (maxWeight > 0) return `${name} ${setCount}×${formatNum(maxWeight)}`;
    if (totalReps > 0) return `${name} ${totalReps}次`;
    return name;
  }

  function formatNum(n) {
    if (n >= 10000) return (n / 1000).toFixed(1) + 'k';
    if (!Number.isInteger(n)) return n.toFixed(1);
    return String(n);
  }

  function formatDuration(seconds) {
    seconds = Math.max(0, Math.round(Number(seconds) || 0));
    if (seconds === 0) return '0秒';
    if (seconds < 60) return seconds + '秒';
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    if (s === 0) return m + '分';
    return m + '分' + s + '秒';
  }

  function calcCurrentStreak() {
    const d = new Date();
    let cur = 0;
    const todayK = dateKey(d.getFullYear(), d.getMonth(), d.getDate());
    if (!hasTraining(todayK)) d.setDate(d.getDate() - 1);
    while (true) {
      const k = dateKey(d.getFullYear(), d.getMonth(), d.getDate());
      if (hasTraining(k)) {
        cur++;
        d.setDate(d.getDate() - 1);
      } else break;
      if (cur > 3650) break;
    }
    return cur;
  }
  function calcMaxStreak() {
    const keys = Object.keys(data.days)
      .filter(k => data.days[k] && data.days[k].length > 0)
      .sort();
    if (keys.length === 0) return 0;
    let max = 1, cur = 1;
    for (let i = 1; i < keys.length; i++) {
      const prev = new Date(keys[i - 1]);
      const curr = new Date(keys[i]);
      const diff = Math.round((curr - prev) / 86400000);
      if (diff === 1) cur++;
      else cur = 1;
      if (cur > max) max = cur;
    }
    return max;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function formatMonthlyVolume(b) {
    const parts = [];
    if (b.weight > 0) {
      if (b.weight >= 100000) parts.push((b.weight / 1000).toFixed(1) + 't');
      else if (b.weight >= 1000) parts.push((b.weight / 1000).toFixed(1) + 'k');
      else parts.push(Math.round(b.weight) + 'kg');
    }
    if (b.distance > 0) parts.push(b.distance.toFixed(1) + 'km');
    if (b.reps > 0) parts.push(b.reps + '个');
    if (b.time > 0) parts.push(formatDuration(b.time));
    return parts.length > 0 ? parts.join('·') : '0';
  }

  function animateNumber(el, target) {
    target = Number(target) || 0;
    const current = parseInt(el.textContent, 10) || 0;
    if (current === target) return;
    const start = performance.now();
    const duration = 500;
    function step(now) {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(current + (target - current) * eased);
      if (t < 1) requestAnimationFrame(step);
      else el.textContent = String(target);
    }
    requestAnimationFrame(step);
  }

  function isCompact() {
    return window.innerWidth <= 768;
  }

  // ---------- muscle model ----------
  let muscleView = 'front';
  // null = 总体模式 (当天所有动作的肌肉并集); string = 单动作模式 (只显示该动作的肌肉)
  let selectedExerciseName = null;

  function getActiveMuscleRegions() {
    const key = selectedDate || todayKey();
    const day = data.days[key] || [];
    const set = new Set();
    for (const ex of day) {
      const regions = MUSCLE_MAP[ex.name];
      if (!regions) continue;
      // 总体模式: 所有动作并集; 单动作模式: 只取选中的那个
      if (selectedExerciseName === null || selectedExerciseName === ex.name) {
        regions.forEach(r => set.add(r));
      }
    }
    return { set, key, day };
  }

  function renderMuscleModel() {
    const { set, key } = getActiveMuscleRegions();
    document.querySelectorAll('.muscle-region').forEach(p => {
      p.classList.toggle('active', set.has(p.dataset.region));
    });
    const dateObj = parseKey(key);
    const todayK = todayKey();
    const label = key === todayK
      ? `今天 · ${dateObj.getMonth() + 1}/${dateObj.getDate()}`
      : `${dateObj.getMonth() + 1}/${dateObj.getDate()} 周${['日','一','二','三','四','五','六'][dateObj.getDay()]}`;
    const dateEl = document.getElementById('muscle-panel-date');
    if (dateEl) dateEl.textContent = label;
    document.querySelectorAll('.muscle-view').forEach(svg => {
      svg.classList.toggle('is-active', svg.classList.contains(muscleView));
    });
    document.querySelectorAll('#muscle-view-toggle button').forEach(b => {
      b.classList.toggle('active', b.dataset.view === muscleView);
    });
    renderMuscleExerciseList();
  }

  // 渲染 SVG 下方每个动作的肌肉标注卡片
  function renderMuscleExerciseList() {
    const container = document.getElementById('muscle-exercises');
    if (!container) return;
    const { day } = getActiveMuscleRegions();

    // 切换日期后, 选中的动作若不在当前日, 重置为总体模式
    if (selectedExerciseName && !day.some(ex => ex.name === selectedExerciseName)) {
      selectedExerciseName = null;
    }

    if (day.length === 0) {
      container.innerHTML = '<div class="muscle-ex-empty">当日无训练</div>';
      return;
    }

    container.innerHTML = day.map((ex) => {
      const regions = MUSCLE_MAP[ex.name] || [];
      const isSelected = selectedExerciseName === ex.name;
      const isDimmed = selectedExerciseName !== null && !isSelected;
      const cls = ['muscle-ex-item'];
      if (isSelected) cls.push('selected');
      if (isDimmed) cls.push('dimmed');

      let tagsHtml;
      if (regions.length === 0) {
        tagsHtml = '<span class="muscle-ex-tag unmapped">未映射肌肉</span>';
      } else {
        tagsHtml = regions.map(r => {
          const label = REGION_LABELS[r] || r;
          return `<span class="muscle-ex-tag">${escapeHtml(label)}</span>`;
        }).join('');
      }

      return `<div class="${cls.join(' ')}" data-name="${escapeHtml(ex.name)}">
        <div class="muscle-ex-name">${escapeHtml(ex.name)}</div>
        <div class="muscle-ex-tags">${tagsHtml}</div>
      </div>`;
    }).join('');

    // 绑定点击事件
    container.querySelectorAll('.muscle-ex-item').forEach(el => {
      el.addEventListener('click', () => {
        const name = el.dataset.name;
        // toggle: 同一动作再点 = 取消选中 (回总体)
        selectedExerciseName = (selectedExerciseName === name) ? null : name;
        renderMuscleModel(); // 内部会顺带调用 renderMuscleExerciseList
      });
    });
  }

  // ---------- render ----------

  // 日历单元格排序：有氧 → 瑜伽 → 力量训练 → 其他；同组内按名称字数升序
  const STRENGTH_CATEGORIES = new Set(['腿', '推', '拉', '核心']);
  function categoryGroupRank(name) {
    const cat = (data.exercises.find(e => e.name === name) || {}).category || '其他';
    if (cat === '有氧') return 0;
    if (cat === '瑜伽') return 1;
    if (STRENGTH_CATEGORIES.has(cat)) return 2;
    return 3;
  }
  function compareForCalendar(a, b) {
    const diff = categoryGroupRank(a.name) - categoryGroupRank(b.name);
    return diff !== 0 ? diff : a.name.length - b.name.length;
  }

  function renderAll() {
    renderCalendar();
    renderDrawer();
    renderStats();
    renderMuscleModel();
    renderMuscleExerciseList();
  }

  function renderCalendar() {
    computeMaxIntensity();
    const grid = document.getElementById('calendar-grid');
    grid.innerHTML = '';

    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
    const todayK = todayKey();
    const compact = isCompact();
    const maxLines = compact ? 3 : 5;
    const fragment = document.createDocumentFragment();

    for (let i = 0; i < 42; i++) {
      let cellYear = viewYear;
      let cellMonth = viewMonth;
      let cellDay;
      if (i < firstDay) {
        cellMonth--;
        if (cellMonth < 0) { cellMonth = 11; cellYear--; }
        cellDay = daysInPrevMonth - (firstDay - 1 - i);
      } else if (i >= firstDay + daysInMonth) {
        cellMonth++;
        if (cellMonth > 11) { cellMonth = 0; cellYear++; }
        cellDay = i - firstDay - daysInMonth + 1;
      } else {
        cellDay = i - firstDay + 1;
      }

      const key = dateKey(cellYear, cellMonth, cellDay);
      const isOtherMonth = cellMonth !== viewMonth;
      const isToday = key === todayK;
      const dayData = data.days[key];
      const trained = !!(dayData && dayData.length > 0);
      const intensity = dayIntensity(dayData);

      const cell = document.createElement('div');
      cell.className = 'day-cell';
      cell.dataset.key = key;
      if (isOtherMonth) cell.classList.add('other-month');
      if (isToday) cell.classList.add('today');
      if (trained) cell.classList.add('has-training');

      if (intensity > 0 && maxIntensity > 0) {
        const t = Math.min(1, intensity / maxIntensity);
        cell.style.background = `linear-gradient(180deg, rgba(255,107,53,${0.10 + t * 0.30}), var(--card))`;
      }

      const numSpan = document.createElement('span');
      numSpan.className = 'day-num';
      numSpan.textContent = cellDay;
      cell.appendChild(numSpan);

      if (trained) {
        const lines = document.createElement('div');
        lines.className = 'day-lines';
        const summaries = dayData.slice().sort(compareForCalendar).map(ex => {
          const unit = ex.unit || getExerciseUnit(ex.name);
          return { text: formatExerciseSummary(ex, unit), unit };
        }).filter(s => s.text);

        const shown = summaries.slice(0, maxLines);
        for (const s of shown) {
          const line = document.createElement('div');
          line.className = `day-line ${s.unit}`;
          line.textContent = s.text;
          line.title = s.text;
          lines.appendChild(line);
        }
        if (summaries.length > maxLines) {
          const more = document.createElement('div');
          more.className = 'day-more';
          more.textContent = `+${summaries.length - maxLines}`;
          more.title = `还有 ${summaries.length - maxLines} 项，悬停查看全部`;
          lines.appendChild(more);
        }
        cell.appendChild(lines);
      }

      // 用 mousedown 处理拖拽，mouseup 决定是点击还是拖拽
      cell.addEventListener('mousedown', (e) => onCellMouseDown(e, cell, key));
      if (trained) attachCellHover(cell, key, dayData);
      fragment.appendChild(cell);
    }

    grid.appendChild(fragment);
    document.getElementById('month-label').textContent = `${viewYear} 年 ${viewMonth + 1} 月`;

    // 重新渲染时如果之前在拖拽，恢复选中/落点状态
    if (boxStart && isBoxSelecting) {
      // 重置即可（拖拽状态在新一轮渲染中已失效）
      cancelBoxSelection();
    }
    applySelectedState();
  }

  function attachCellHover(cell, key, dayData) {
    cell.addEventListener('mouseenter', () => {
      if (isCompact() || boxStart) return;
      clearTimeout(hoverTimeout);
      hoverTimeout = setTimeout(() => {
        if (!boxStart) showDayTooltip(cell, key, dayData);
      }, 260);
    });
    cell.addEventListener('mouseleave', () => {
      if (boxStart) return;
      clearTimeout(hoverTimeout);
      hideDayTooltip();
    });
  }

  function showDayTooltip(cellEl, key, dayData) {
    const tooltip = document.getElementById('day-tooltip');
    const dateObj = parseKey(key);
    const weekday = ['日', '一', '二', '三', '四', '五', '六'][dateObj.getDay()];

    let bodyHtml = '<div class="day-tooltip-body">';
    for (const ex of dayData.slice().sort(compareForCalendar)) {
      const unit = ex.unit || getExerciseUnit(ex.name);
      const tag = UNIT_LABELS[unit].tag;
      bodyHtml += `<div class="day-tooltip-exercise ${unit}">
        <div class="day-tooltip-exercise-name">
          ${escapeHtml(ex.name)}
          <span class="unit-tag ${unit}">${tag}</span>
        </div>`;

      if (unit === 'distance') {
        const total = ex.sets.reduce((s, x) => s + (Number(x.distance) || 0), 0);
        if (ex.sets.length === 1) {
          bodyHtml += `<div class="day-tooltip-set"><span class="set-idx">·</span><span class="set-val">${formatNum(total)} km</span></div>`;
        } else {
          bodyHtml += `<div class="day-tooltip-set"><span class="set-idx">${ex.sets.length}组</span><span class="set-val">合计 ${formatNum(total)} km</span></div>`;
          ex.sets.forEach((s, i) => {
            bodyHtml += `<div class="day-tooltip-set"><span class="set-idx">${i + 1}</span><span class="set-val">${formatNum(s.distance || 0)} km</span></div>`;
          });
        }
      } else if (unit === 'reps') {
        const total = ex.sets.reduce((s, x) => s + (Number(x.reps) || 0), 0);
        if (ex.sets.length === 1) {
          bodyHtml += `<div class="day-tooltip-set"><span class="set-idx">·</span><span class="set-val">${total} 个</span></div>`;
        } else {
          bodyHtml += `<div class="day-tooltip-set"><span class="set-idx">${ex.sets.length}组</span><span class="set-val">合计 ${total} 个</span></div>`;
          ex.sets.forEach((s, i) => {
            bodyHtml += `<div class="day-tooltip-set"><span class="set-idx">${i + 1}</span><span class="set-val">${s.reps || 0} 个</span></div>`;
          });
        }
      } else if (unit === 'time') {
        const totalSets = ex.sets.reduce((s, x) => s + (Number(x.reps) || 0), 0);
        const totalSeconds = ex.sets.reduce((s, x) => s + (Number(x.reps) || 0) * (Number(x.duration) || 0), 0);
        if (ex.sets.length === 1) {
          bodyHtml += `<div class="day-tooltip-set"><span class="set-idx">·</span><span class="set-val">${totalSets} 组 × ${formatDuration(Math.round(Number(ex.sets[0].duration) || 0))}</span></div>`;
        } else {
          bodyHtml += `<div class="day-tooltip-set"><span class="set-idx">${ex.sets.length}项</span><span class="set-val">合计 ${totalSets} 组 · ${formatDuration(totalSeconds)}</span></div>`;
          ex.sets.forEach((s, i) => {
            bodyHtml += `<div class="day-tooltip-set"><span class="set-idx">${i + 1}</span><span class="set-val">${s.reps || 0} 组 × ${formatDuration(Number(s.duration) || 0)}</span></div>`;
          });
        }
      } else {
        ex.sets.forEach((s, i) => {
          bodyHtml += `<div class="day-tooltip-set"><span class="set-idx">${i + 1}</span><span class="set-val">${s.reps || 0} 次 × ${formatNum(s.weight || 0)} kg</span></div>`;
        });
      }
      bodyHtml += `</div>`;
    }
    bodyHtml += '</div>';

    tooltip.innerHTML = `
      <div class="day-tooltip-header">
        ${dateObj.getMonth() + 1}月${dateObj.getDate()}日 · 周${weekday}
        <span class="badge">${dayData.length}项</span>
      </div>
      ${bodyHtml}
      <div class="day-tooltip-footer">点击查看/编辑 · 拖拽可复制</div>
    `;

    tooltip.style.left = '0px';
    tooltip.style.top = '0px';
    tooltip.style.visibility = 'hidden';
    tooltip.classList.add('show');

    requestAnimationFrame(() => {
      const cellRect = cellEl.getBoundingClientRect();
      const tipRect = tooltip.getBoundingClientRect();
      const margin = 8;

      let left = cellRect.left + cellRect.width / 2 - tipRect.width / 2;
      let top = cellRect.top - tipRect.height - 12;

      if (top < margin) top = cellRect.bottom + 12;
      if (left < margin) left = margin;
      if (left + tipRect.width > window.innerWidth - margin) {
        left = window.innerWidth - tipRect.width - margin;
      }

      tooltip.style.left = left + 'px';
      tooltip.style.top = top + 'px';
      tooltip.style.visibility = '';
    });
  }

  function hideDayTooltip() {
    document.getElementById('day-tooltip').classList.remove('show');
  }

  function renderDrawer() {
    const drawer = document.getElementById('drawer');

    if (!selectedDate) {
      drawer.innerHTML = `
        <div class="drawer-empty">
          <div class="icon">📅</div>
          <div>点击左侧任意日期</div>
          <div class="hint">记录训练 · 追踪进步</div>
        </div>
      `;
      drawer.classList.remove('open');
      return;
    }

    const dayData = data.days[selectedDate] || [];
    const dateObj = parseKey(selectedDate);
    const weekday = ['日', '一', '二', '三', '四', '五', '六'][dateObj.getDay()];
    const dateLabel = `${dateObj.getMonth() + 1} 月 ${dateObj.getDate()} 日 · 周${weekday}`;
    const isEmpty = dayData.length === 0;
    const restMsg = REST_MESSAGES[Math.floor(Math.random() * REST_MESSAGES.length)];

    let bodyHtml;
    if (isEmpty) {
      bodyHtml = `
        <div class="drawer-empty">
          <div class="icon">😴</div>
          <div>${restMsg}</div>
        </div>
      `;
    } else {
      let listHtml = '<div class="exercises-list">';
      dayData.forEach((ex, exIdx) => {
        const unit = ex.unit || getExerciseUnit(ex.name);
        const labels = UNIT_LABELS[unit];
        listHtml += `<div class="exercise-block" data-ex="${exIdx}">
          <div class="exercise-head">
            <div class="exercise-name">${escapeHtml(ex.name)}</div>
            <span class="exercise-tag ${labels.cssClass}">${labels.tag}</span>
            <button class="exercise-delete" data-action="delete-ex" data-ex="${exIdx}">删除</button>
          </div>
          <div class="sets-table">`;
        ex.sets.forEach((set, setIdx) => {
          listHtml += renderSetRow(exIdx, setIdx, ex, unit);
        });
        listHtml += `</div>
          <button class="add-set-btn" data-action="add-set" data-ex="${exIdx}">+ 添加组</button>
        </div>`;
      });
      listHtml += '</div>';
      bodyHtml = listHtml;
    }

    const optionsHtml = data.exercises
      .map(ex => {
        const tag = UNIT_LABELS[ex.unit || 'weight'].tag;
        return `<option value="${escapeHtml(ex.name)}">${escapeHtml(ex.name)} · ${escapeHtml(ex.category)} · ${tag}</option>`;
      })
      .join('');

    drawer.innerHTML = `
      <div class="drawer-header">
        <h2>${dateLabel}</h2>
        <button class="drawer-close" aria-label="关闭">×</button>
      </div>
      <div class="drawer-body">${bodyHtml}</div>
      <div class="drawer-footer">
        <select class="exercise-selector" id="exercise-selector">
          <option value="">+ 选择动作添加...</option>
          ${optionsHtml}
        </select>
        ${!isEmpty ? '<button class="clear-day-btn" id="clear-day">清空当天训练</button>' : ''}
      </div>
    `;

    drawer.querySelector('.drawer-close').addEventListener('click', closeDrawer);
    drawer.querySelectorAll('[data-action="delete-ex"]').forEach(btn => {
      btn.addEventListener('click', () => deleteExercise(Number(btn.dataset.ex)));
    });
    drawer.querySelectorAll('[data-action="delete-set"]').forEach(btn => {
      btn.addEventListener('click', () => deleteSet(Number(btn.dataset.ex), Number(btn.dataset.set)));
    });
    drawer.querySelectorAll('[data-action="add-set"]').forEach(btn => {
      btn.addEventListener('click', () => addSet(Number(btn.dataset.ex)));
    });
    drawer.querySelectorAll('.set-row input').forEach(input => {
      input.addEventListener('input', updateSet);
    });
    drawer.querySelector('#exercise-selector').addEventListener('change', onAddExerciseSelect);
    const clearBtn = drawer.querySelector('#clear-day');
    if (clearBtn) clearBtn.addEventListener('click', clearDay);

    if (isCompact()) {
      requestAnimationFrame(() => drawer.classList.add('open'));
    }
  }

  function renderSetRow(exIdx, setIdx, ex, unit) {
    const labels = UNIT_LABELS[unit];
    if (unit === 'distance') {
      return `
        <div class="set-row unit-distance" data-ex="${exIdx}" data-set="${setIdx}">
          <div class="set-num">${setIdx + 1}</div>
          <div class="input-cell">
            <input type="number" inputmode="decimal" min="0" step="0.1" placeholder="${labels.input}" value="${ex.sets[setIdx].distance ?? ''}" data-field="distance">
            <span class="unit">${labels.suffix}</span>
          </div>
          <button class="set-delete" data-action="delete-set" data-ex="${exIdx}" data-set="${setIdx}" aria-label="删除组">×</button>
        </div>`;
    }
    if (unit === 'reps') {
      return `
        <div class="set-row unit-reps" data-ex="${exIdx}" data-set="${setIdx}">
          <div class="set-num">${setIdx + 1}</div>
          <div class="input-cell">
            <input type="number" inputmode="numeric" min="0" placeholder="${labels.input}" value="${ex.sets[setIdx].reps ?? ''}" data-field="reps">
            <span class="unit">${labels.suffix}</span>
          </div>
          <button class="set-delete" data-action="delete-set" data-ex="${exIdx}" data-set="${setIdx}" aria-label="删除组">×</button>
        </div>`;
    }
    if (unit === 'time') {
      return `
        <div class="set-row unit-time" data-ex="${exIdx}" data-set="${setIdx}">
          <div class="set-num">${setIdx + 1}</div>
          <div class="input-cell">
            <input type="number" inputmode="numeric" min="0" placeholder="组数" value="${ex.sets[setIdx].reps ?? ''}" data-field="reps">
            <span class="unit">组</span>
          </div>
          <div class="input-cell">
            <input type="number" inputmode="numeric" min="0" step="5" placeholder="时长" value="${ex.sets[setIdx].duration ?? ''}" data-field="duration">
            <span class="unit">秒</span>
          </div>
          <button class="set-delete" data-action="delete-set" data-ex="${exIdx}" data-set="${setIdx}" aria-label="删除组">×</button>
        </div>`;
    }
    return `
      <div class="set-row unit-weight" data-ex="${exIdx}" data-set="${setIdx}">
        <div class="set-num">${setIdx + 1}</div>
        <div class="input-cell">
          <input type="number" inputmode="numeric" min="0" placeholder="次数" value="${ex.sets[setIdx].reps ?? ''}" data-field="reps">
          <span class="unit">次</span>
        </div>
        <div class="input-cell">
          <input type="number" inputmode="decimal" min="0" step="0.5" placeholder="${labels.input}" value="${ex.sets[setIdx].weight ?? ''}" data-field="weight">
          <span class="unit">${labels.suffix}</span>
        </div>
        <button class="set-delete" data-action="delete-set" data-ex="${exIdx}" data-set="${setIdx}" aria-label="删除组">×</button>
      </div>`;
  }

  function renderStats() {
    let trainingDays = 0;
    const totals = { weight: 0, distance: 0, reps: 0, time: 0 };
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
      const k = dateKey(viewYear, viewMonth, d);
      if (hasTraining(k)) trainingDays++;
      const b = dayBreakdown(data.days[k]);
      totals.weight += b.weight;
      totals.distance += b.distance;
      totals.reps += b.reps;
      totals.time += b.time;
    }

    animateNumber(document.getElementById('stat-days'), trainingDays);
    animateNumber(document.getElementById('stat-streak'), calcCurrentStreak());
    animateNumber(document.getElementById('stat-max-streak'), calcMaxStreak());
    document.getElementById('stat-volume').textContent = formatMonthlyVolume(totals);
  }

  // ---------- actions ----------
  function selectDate(key) {
    selectedDate = key;
    renderDrawer();
    applySelectedState();
    renderMuscleModel();
  }
  function closeDrawer() {
    selectedDate = null;
    const drawer = document.getElementById('drawer');
    drawer.classList.remove('open');
    setTimeout(() => {
      if (!selectedDate) renderDrawer();
    }, 280);
    applySelectedState();
    renderMuscleModel();
  }

  function getDefaultSet(unit) {
    if (unit === 'distance') return { distance: 0 };
    if (unit === 'reps') return { reps: 0 };
    if (unit === 'time') return { reps: 0, duration: 0 };
    return { reps: 0, weight: 0 };
  }

  function addExercise(name) {
    if (!selectedDate) return;
    if (!data.days[selectedDate]) data.days[selectedDate] = [];
    const lib = data.exercises.find(e => e.name === name);
    const unit = (lib && lib.unit) || 'weight';
    const lastSet = (data.days[selectedDate].slice(-1)[0] || {}).sets?.slice(-1)[0];
    let newSet;
    if (unit === 'distance') newSet = { distance: lastSet?.distance || 0 };
    else if (unit === 'reps') newSet = { reps: lastSet?.reps || 0 };
    else if (unit === 'time') newSet = { reps: lastSet?.reps || 0, duration: lastSet?.duration || 0 };
    else newSet = { reps: lastSet?.reps || 0, weight: lastSet?.weight || 0 };
    data.days[selectedDate].push({ name, unit, sets: [newSet] });
    saveData();
    renderDrawer();
    renderCalendar();
    renderStats();
    renderMuscleModel();
  }

  function deleteExercise(exIdx) {
    if (!selectedDate || !data.days[selectedDate]) return;
    data.days[selectedDate].splice(exIdx, 1);
    if (data.days[selectedDate].length === 0) delete data.days[selectedDate];
    saveData();
    renderDrawer();
    renderCalendar();
    renderStats();
    renderMuscleModel();
  }

  function addSet(exIdx) {
    if (!selectedDate || !data.days[selectedDate]) return;
    const ex = data.days[selectedDate][exIdx];
    if (!ex) return;
    const unit = ex.unit || getExerciseUnit(ex.name);
    const last = ex.sets.slice(-1)[0];
    let ns;
    if (unit === 'distance') ns = { distance: last?.distance || 0 };
    else if (unit === 'reps') ns = { reps: last?.reps || 0 };
    else if (unit === 'time') ns = { reps: last?.reps || 0, duration: last?.duration || 0 };
    else ns = { reps: last?.reps || 0, weight: last?.weight || 0 };
    ex.sets.push(ns);
    saveData();
    renderDrawer();
    renderCalendar();
    renderStats();
    renderMuscleModel();
  }

  function deleteSet(exIdx, setIdx) {
    if (!selectedDate || !data.days[selectedDate]) return;
    const ex = data.days[selectedDate][exIdx];
    if (!ex) return;
    ex.sets.splice(setIdx, 1);
    if (ex.sets.length === 0) data.days[selectedDate].splice(exIdx, 1);
    if (data.days[selectedDate].length === 0) delete data.days[selectedDate];
    saveData();
    renderDrawer();
    renderCalendar();
    renderStats();
    renderMuscleModel();
  }

  function updateSet(e) {
    const input = e.target;
    const row = input.closest('.set-row');
    if (!row) return;
    const exIdx = Number(row.dataset.ex);
    const setIdx = Number(row.dataset.set);
    const field = input.dataset.field;
    const val = parseFloat(input.value) || 0;
    const ex = data.days[selectedDate]?.[exIdx];
    if (!ex) return;
    ex.sets[setIdx][field] = val;
    saveData();
    renderCalendar();
    renderStats();
    renderMuscleModel();
  }

  function onAddExerciseSelect(e) {
    const val = e.target.value;
    e.target.value = '';
    if (!val) return;
    addExercise(val);
  }

  function clearDay() {
    if (!selectedDate) return;
    const dateObj = parseKey(selectedDate);
    const label = `${dateObj.getMonth() + 1} 月 ${dateObj.getDate()} 日`;
    if (!confirm(`确认清空 ${label} 的所有训练？`)) return;
    delete data.days[selectedDate];
    saveData();
    renderDrawer();
    renderCalendar();
    renderStats();
    renderMuscleModel();
  }

  // ---------- box selection ----------
  function onCellMouseDown(e, cell, key) {
    if (e.button !== 0) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT') return;

    boxStart = { x: e.clientX, y: e.clientY };
    boxStartKey = key;
    isBoxSelecting = false;
    boxSelectedKeys = new Set();
    currentDropKey = null;

    if (hasTraining(key)) {
      boxSelectedKeys.add(key);
      cell.classList.add('box-selected');
    }

    document.body.style.userSelect = 'none';
    document.body.classList.add('box-dragging');
    hideDayTooltip();
  }

  function rectsIntersect(a, b) {
    return !(b.right < a.left || b.left > a.right || b.bottom < a.top || b.top > a.bottom);
  }

  function getRectBounds(rectEl) {
    return {
      left: parseFloat(rectEl.style.left) || 0,
      top: parseFloat(rectEl.style.top) || 0,
      right: (parseFloat(rectEl.style.left) || 0) + (parseFloat(rectEl.style.width) || 0),
      bottom: (parseFloat(rectEl.style.top) || 0) + (parseFloat(rectEl.style.height) || 0)
    };
  }

  function updateBoxRect(x, y) {
    const rect = document.getElementById('box-rect');
    const left = Math.min(boxStart.x, x);
    const top = Math.min(boxStart.y, y);
    const width = Math.abs(x - boxStart.x);
    const height = Math.abs(y - boxStart.y);
    rect.style.left = left + 'px';
    rect.style.top = top + 'px';
    rect.style.width = width + 'px';
    rect.style.height = height + 'px';
    rect.classList.add('show');
  }

  function updateSelectionState() {
    const rectEl = document.getElementById('box-rect');
    const bounds = getRectBounds(rectEl);

    // 落点 = 矩形对角处的单元（远离 mousedown 起点的那一侧）
    const cornerX = boxStart.x < bounds.right - 2 ? bounds.right - 2 : bounds.left + 2;
    const cornerY = boxStart.y < bounds.bottom - 2 ? bounds.bottom - 2 : bounds.top + 2;

    let dropCell = null;
    const els = document.elementsFromPoint(cornerX, cornerY);
    for (const el of els) {
      if (el.classList && el.classList.contains('day-cell')) {
        dropCell = el;
        break;
      }
    }
    const dropKey = dropCell ? dropCell.dataset.key : null;

    // 源 = 矩形内所有有训练的单元（包括落点也允许；复制时会跳过落点本身）
    const newSelected = new Set();
    document.querySelectorAll('.day-cell').forEach(cell => {
      if (!cell.dataset.key) return;
      const cellRect = cell.getBoundingClientRect();
      if (!rectsIntersect(bounds, cellRect)) return;
      const k = cell.dataset.key;
      if (hasTraining(k)) {
        newSelected.add(k);
      }
    });

    // 更新视觉
    document.querySelectorAll('.day-cell').forEach(cell => {
      if (!cell.dataset.key) return;
      const k = cell.dataset.key;
      cell.classList.remove('box-selected');
      cell.classList.remove('drop-target');
      if (newSelected.has(k)) cell.classList.add('box-selected');
    });
    if (dropCell && dropCell.dataset.key) {
      dropCell.classList.remove('box-selected');
      dropCell.classList.add('drop-target');
    }

    boxSelectedKeys = newSelected;
    currentDropKey = dropKey;
  }

  function cancelBoxSelection() {
    document.querySelectorAll('.day-cell.box-selected, .day-cell.drop-target').forEach(c => {
      c.classList.remove('box-selected');
      c.classList.remove('drop-target');
    });
    document.getElementById('box-rect').classList.remove('show');
    document.body.style.userSelect = '';
    document.body.classList.remove('box-dragging', 'box-selecting');
    boxStart = null;
    boxStartKey = null;
    isBoxSelecting = false;
    boxSelectedKeys.clear();
    currentDropKey = null;
  }

  function performCopy(sourceKeys, targetKey) {
    if (sourceKeys.size === 0) return;

    let copiedCount = 0;
    if (!data.days[targetKey]) data.days[targetKey] = [];

    for (const k of sourceKeys) {
      if (k === targetKey) continue;
      const dayData = data.days[k] || [];
      for (const ex of dayData) {
        data.days[targetKey].push({
          name: ex.name,
          unit: ex.unit,
          sets: ex.sets.map(s => ({ ...s }))
        });
        copiedCount++;
      }
    }

    if (copiedCount === 0) return;

    saveData();
    renderCalendar();
    renderStats();

    const dateObj = parseKey(targetKey);
    const label = `${dateObj.getMonth() + 1}月${dateObj.getDate()}日`;
    showToast(`已复制 ${copiedCount} 项训练到 ${label}`, '✓');
  }

  function showToast(message, icon = '✓') {
    const toast = document.getElementById('toast');
    toast.innerHTML = `<span class="toast-icon">${icon}</span><span>${escapeHtml(message)}</span>`;
    toast.classList.add('show');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => toast.classList.remove('show'), 2400);
  }

  async function onTestToken() {
    const input = document.getElementById('pat-input');
    const resultEl = document.getElementById('pat-test-result');
    const testBtn = document.getElementById('pat-test');
    const token = input.value.trim();
    resultEl.style.display = 'none';
    if (!token) {
      resultEl.style.display = 'block';
      resultEl.style.background = 'var(--danger)';
      resultEl.innerHTML = '<b style="color:var(--training)">请先粘贴 Token</b>';
      return;
    }
    testBtn.disabled = true;
    testBtn.textContent = '测试中...';
    const prevToken = authToken;
    authToken = token;
    resultEl.style.display = 'block';
    resultEl.style.background = 'var(--card)';
    resultEl.innerHTML = '正在调用 GitHub API...';
    try {
      const user = await validateToken();
      let repoStatus = '';
      try {
        await checkRepoAccess();
        repoStatus = `<div style="margin-top:6px;color:var(--cardio);">✓ 仓库访问正常</div>`;
      } catch (repoErr) {
        if (repoErr.status === 404) {
          repoStatus = `<div style="margin-top:6px;color:var(--training);">✗ Token 看不到仓库 <code>${escapeHtml(REPO.owner)}/${escapeHtml(REPO.repo)}</code></div>`;
        } else if (repoErr.status === 403) {
          repoStatus = `<div style="margin-top:6px;color:var(--training);">✗ Token 没有仓库写权限</div>`;
        } else {
          repoStatus = `<div style="margin-top:6px;color:var(--training);">✗ 仓库访问失败：${escapeHtml(repoErr.message)}</div>`;
        }
      }
      const isOwner = user.login.toLowerCase() === REPO.owner.toLowerCase();
      resultEl.innerHTML = `
        <div><b style="color:var(--cardio)">✓ Token 有效</b></div>
        <div style="margin-top:6px;">Token 属于：<b style="color:var(--primary)">@${escapeHtml(user.login)}</b>${isOwner ? '（仓库所有者）' : ''}</div>
        ${repoStatus}
        ${!isOwner && repoStatus.includes('✗') ? `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:11px;color:var(--text-dim);">
          需要让 <b style="color:var(--text)">@${escapeHtml(REPO.owner)}</b> 这个账号有写权限：<br>
          · 你登的就是 <b style="color:var(--text)">@${escapeHtml(REPO.owner)}</b> → 重新生成 PAT 后再试<br>
          · 登的是别的账号 → 让 owner 在仓库 Settings → Collaborators 加你
        </div>` : ''}
      `;
    } catch (err) {
      resultEl.style.background = 'var(--danger)';
      if (err.status === 401) {
        resultEl.innerHTML = `<b style="color:var(--training)">✗ Token 无效或已过期</b><div style="margin-top:6px;font-size:11px;">请检查复制是否完整、是否已撤销</div>`;
      } else if (err.status === 0) {
        resultEl.innerHTML = `<b style="color:var(--training)">✗ 网络错误</b><div style="margin-top:6px;font-size:11px;">无法连接到 GitHub API</div>`;
      } else {
        resultEl.innerHTML = `<b style="color:var(--training)">✗ ${escapeHtml(err.message)}</b>`;
      }
    } finally {
      authToken = prevToken;
      testBtn.disabled = false;
      testBtn.textContent = '🔍 测试 Token（不保存）';
    }
  }

  async function onSaveToken() {
    const input = document.getElementById('pat-input');
    const errEl = document.getElementById('pat-error');

  async function checkRepoAccess() {
    const { owner, repo } = REPO;
    await gh(`/repos/${owner}/${repo}`);
  }

  function friendlyError(err) {
    if (err.status === 0) {
      return '网络错误，请检查网络连接后重试';
    }
    if (err.status === 401) {
      return 'Token 无效或已过期，请重新创建并复制完整';
    }
    if (err.status === 403) {
      const msg = err.body && err.body.message || '';
      if (msg.includes('rate limit')) return 'API 限速，请稍后再试';
      if (msg.includes('Resource not accessible')) {
        return `Token 对仓库 ${REPO.owner}/${REPO.repo} 没有写权限。\n请确认：① PAT 创建时勾选了 public_repo（或 repo）权限；② 创建 PAT 的 GitHub 账号是 ${REPO.owner} 或该仓库的协作者。`;
      }
      return '权限不足：' + msg;
    }
    if (err.status === 404) {
      return `找不到仓库 ${REPO.owner}/${REPO.repo}，或 Token 无权访问。\n请确认仓库存在且 Token 所属账号对它有写权限。`;
    }
    if (err.status === 409) {
      return '另一台设备正在同时改，正在重试';
    }
    return err.message || '连接失败';
  }
